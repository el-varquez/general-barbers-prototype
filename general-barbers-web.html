<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Barbers — Shop Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#24522F; --priDk:#12301C; --priMd:#2F6A3E; --priLt:#3E8A52;
  --acc:#4DB56A; --bg:#09130D; --panel:#0F1C14; --card:#142A1B; --cardHi:#1B3823;
  --text:#fff; --textMd:rgba(255,255,255,.72); --textDm:rgba(255,255,255,.44);
  --border:rgba(255,255,255,.07); --borderHi:rgba(77,181,106,.28);
  --warn:#F59E0B; --blue:#60A5FA; --danger:#F16A75;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --tex:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.11) 0 1px,transparent 1px 3px);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden;
}

/* ---------- sidebar ---------- */
.side{
  width:236px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;
}
.side-brand{padding:20px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.side-brand .sq{width:38px;height:38px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.side-brand h1{font-size:14px;font-weight:700;letter-spacing:.9px;line-height:1.2}
.side-brand p{font-size:11px;color:var(--textDm);margin-top:2px}

.branchsel{margin:14px 14px 6px;padding:11px 13px;border-radius:11px;background:var(--card);border:1px solid var(--border);cursor:pointer}
.branchsel .lbl{font-size:10px;color:var(--textDm);letter-spacing:.5px;text-transform:uppercase}
.branchsel .val{font-size:13.5px;font-weight:600;margin-top:3px;display:flex;justify-content:space-between;align-items:center}

.navgroup{padding:14px 14px 4px}
.navgroup .gl{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--textDm);padding:0 10px 8px}
.side nav{flex:1;overflow-y:auto;padding-bottom:14px}
.navitem{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px;border-radius:10px;margin-bottom:2px;
  background:none;border:none;color:var(--textMd);font-family:inherit;
  font-size:13.5px;cursor:pointer;text-align:left;transition:.14s;
}
.navitem:hover{background:rgba(255,255,255,.04);color:var(--text)}
.navitem.on{background:rgba(77,181,106,.14);color:var(--acc);font-weight:600}
.navitem .ic{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.navitem .ct{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(77,181,106,.2);color:var(--acc);padding:2px 7px;border-radius:20px}

.side-foot{padding:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.side-foot .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--priMd));display:flex;align-items:center;justify-content:center;font-size:15px}
.side-foot .nm{font-size:13px;font-weight:600}
.side-foot .rl{font-size:11px;color:var(--textDm)}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{
  height:62px;flex-shrink:0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--panel);
}
.topbar h2{font-size:17px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--textDm);margin-top:1px}
.topact{display:flex;align-items:center;gap:10px}
.search{
  display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:8px 13px;width:250px;
}
.search input{background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13px;width:100%}
.search input::placeholder{color:var(--textDm)}
.tbtn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--textMd);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.tbtn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:4px;background:var(--acc)}

.content{flex:1;overflow-y:auto;padding:22px 26px 34px}

/* ---------- shared ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px}
.cardpad{padding:18px 20px}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.cardhead h3{font-size:15px;font-weight:600}
.cardhead .sub{font-size:12px;color:var(--textDm);margin-top:2px}

.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.stat .lbl{font-size:12px;color:var(--textDm)}
.stat .val{font-size:29px;font-weight:700;margin:7px 0 4px;letter-spacing:-.5px}
.stat .dlt{font-size:12px;color:var(--acc);font-weight:500}
.stat .ic{float:right;font-size:19px;opacity:.85}

.cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:0 10px 11px;font-size:11px;color:var(--textDm);font-weight:600;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:13px 10px;border-bottom:1px solid var(--border)}
tbody tr{transition:.12s;cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child td{border-bottom:none}
.mono{font-weight:600;color:var(--acc);font-size:12px;letter-spacing:.3px}
.md{color:var(--textMd)}
.dm{color:var(--textDm)}

.st{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block}

.pill{
  padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:500;
  background:var(--card);border:1px solid var(--border);color:var(--textMd);
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:.14s;
}
.pill:hover{border-color:var(--borderHi);color:var(--text)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

.btn{
  padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:600;color:#fff;background:var(--acc);transition:.14s;
}
.btn:hover{background:var(--priLt)}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--textMd)}
.btn.ghost:hover{border-color:var(--borderHi);color:var(--text)}

.qitem{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;margin-bottom:7px}
.qnum{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff}

.brow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.brow:last-child{border-bottom:none}
.bav{width:36px;height:36px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--priDk),var(--priMd));display:flex;align-items:center;justify-content:center;font-size:16px}

.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pri),var(--acc))}

.chart{display:flex;align-items:flex-end;gap:9px;height:170px;padding-top:12px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .bx{width:100%;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--acc),var(--pri));min-height:5px;transition:.2s;position:relative}
.chart .bx:hover{background:linear-gradient(180deg,var(--priLt),var(--acc))}
.chart .lb{font-size:11px;color:var(--textDm)}

.scanbox{
  width:100%;max-width:300px;aspect-ratio:1;margin:0 auto 18px;
  border:2px dashed var(--border);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.015);gap:8px;
}
.corner{position:relative}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--textDm)}
.kv span:last-child{font-weight:500}

.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center}
.bcard .av{width:58px;height:58px;border-radius:17px;margin:0 auto 11px;background:linear-gradient(135deg,var(--priDk),var(--priMd));display:flex;align-items:center;justify-content:center;font-size:26px}

.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.srow{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}

.logotile{background-color:var(--pri);background-image:var(--tex);border-radius:26%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.logotile .gblogo{width:76%}
.pic{background:none!important;padding:0}
.pic svg{width:100%;height:100%;display:block}
.scanbox{border:none;background:none;padding:0;overflow:hidden}
.scanbox svg{width:100%;height:100%;display:block}
.gb-scanline{animation:gbscan 2.6s ease-in-out infinite}
@keyframes gbscan{0%{transform:translateY(0)}50%{transform:translateY(178px)}100%{transform:translateY(0)}}
.empty-art{width:130px;margin:0 auto 12px}
.empty-art svg{width:100%;display:block}
.hstep{display:flex;align-items:flex-start}
.hstep>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:10.5px;color:var(--textDm);text-align:center;line-height:1.2}
.hstep>div::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:rgba(255,255,255,.08)}
.hstep>div:first-child::before{display:none}
.hstep>div i{width:14px;height:14px;border-radius:7px;border:2px solid rgba(255,255,255,.14);background:var(--card);z-index:1;display:block}
.hstep>div.past i{background:var(--acc);border-color:var(--acc)}
.hstep>div.past::before{background:var(--acc)}
.hstep>div.past{color:var(--textMd)}
.hstep>div.now i{border-color:var(--acc);box-shadow:0 0 0 4px rgba(77,181,106,.18)}
.hstep>div.now{color:var(--text);font-weight:600}

/* ---------- users & roles ---------- */
.btn.sm{padding:6px 11px;font-size:12px}
.av.init,.bav.init{font-size:12px;font-weight:700;color:#fff;letter-spacing:.3px}
.matrix{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.matrix th{text-align:left;padding:0 8px 10px;font-size:11px;color:var(--textDm);font-weight:600;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.matrix td{padding:9px 8px;border-bottom:1px solid var(--border)}
.matrix tbody tr:last-child td{border-bottom:none}
.matrix tbody tr{cursor:default}
.matrix tbody tr:hover{background:none}
.matrix td.c{text-align:center}
.tick{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--border);color:transparent;transition:.12s}
.tick.on{background:rgba(77,181,106,.18);border-color:rgba(77,181,106,.45);color:var(--acc)}
.tick.lock{cursor:default}
.tick:not(.lock):hover{border-color:var(--borderHi)}
.modal-bg{position:fixed;inset:0;background:rgba(3,10,6,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;color:var(--textDm);letter-spacing:.3px}
.field input,.field select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none}
.field input:focus,.field select:focus{border-color:var(--borderHi)}
.field input::placeholder{color:var(--textDm)}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolecard{border:1px solid var(--border);border-radius:11px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.rolecard.on{border-color:var(--acc);background:rgba(77,181,106,.08)}
.rolecard b{display:block;font-size:13px;margin-bottom:2px}
.rolecard span{font-size:11.5px;color:var(--textDm);line-height:1.4}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#fff;color:#14201A;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:520px;text-align:center;line-height:1.4}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- boot screen ---------- */
.boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-color:var(--pri);background-image:radial-gradient(70% 70% at 50% 40%,rgba(255,255,255,.12),transparent 60%),var(--tex);transition:opacity .5s ease}
.boot.out{opacity:0;pointer-events:none}
.boot .gblogo{width:250px;animation:bootBadge .9s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 16px 30px rgba(0,0,0,.35))}
.boot-bar{width:250px;height:3px;margin-top:36px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px;animation:bootFill 1.5s .3s cubic-bezier(.45,0,.2,1) forwards}
.boot-cap{margin-top:14px;font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:1.2px;color:#fff}
.boot-sub{margin-top:4px;font-size:12px;color:rgba(255,255,255,.6)}
@keyframes bootBadge{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes bootFill{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){.boot .gblogo{animation:none}.boot-bar i{animation:none;width:100%}.gb-scanline{animation:none}}

@media(max-width:1180px){
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .bgrid{grid-template-columns:repeat(2,1fr)}
  .sgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .side{width:70px}
  .side-brand h1,.side-brand p,.navitem span:not(.ic),.branchsel,.side-foot .nm,.side-foot .rl,.navgroup .gl{display:none}
  .navitem{justify-content:center}
  .search{width:150px}
}
</style>
</head>
<body>

<div class="boot" id="boot">
  <i class="gblogo"></i>
  <div class="boot-bar"><i></i></div>
  <div class="boot-cap">Opening the shop dashboard</div>
  <div class="boot-sub">JP Laurel (Main)</div>
</div>

<aside class="side">
  <div class="side-brand">
    <div class="logotile" style="width:40px;height:40px"><i class="gblogo"></i></div>
    <div><h1>GENERAL BARBERS</h1><p>Shop dashboard</p></div>
  </div>

  <div class="branchsel">
    <div class="lbl">Viewing branch</div>
    <div class="val">JP Laurel (Main) <span class="dm">⌄</span></div>
  </div>

  <nav id="nav"></nav>

  <div class="side-foot" id="sidefoot"></div>
</aside>
<div class="toast" id="toast"></div>

<div class="main">
  <div class="topbar">
    <div><h2 id="pgTitle">Dashboard</h2><div class="sub" id="pgSub">Tuesday, September 1, 2026</div></div>
    <div class="topact">
      <div class="search"><span class="dm">🔍</span><input placeholder="Search booking, customer…"></div>
      <button class="tbtn">🔔<i class="pip"></i></button>
      <button class="tbtn">⚙</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
/* ===== General Barbers — vector art library (shared by both prototypes) ===== */
const GB_ART=(()=>{
const C={g0:'#0F2417',g1:'#1B3A25',g2:'#24522F',g3:'#2F6A3E',g4:'#3E8A52',g5:'#5FA874',
  mint:'#CFE8D5',white:'#FFFFFF',wall:'#F4F7F2',cream:'#F3E9D2',gold:'#E9C46A',red:'#C94141',
  hair:'#1E1B19',ink:'#10251A'};
let uid=0; const id=p=>p+'_'+(++uid);
const FONT='"Oswald","Arial Narrow",Impact,sans-serif';
const svg=(vb,body,extra='')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${extra}>${body}</svg>`;

/* ---------- primitives ---------- */
const STAR='M0-10 2.35-3.24 9.51-3.09 3.8 1.24 5.88 8.09 0 4-5.88 8.09-3.8 1.24-9.51-3.09-2.35-3.24Z';
const stars=(pts,fill,op=1)=>pts.map(([x,y,r])=>`<path transform="translate(${x} ${y}) scale(${(r||4)/10})" d="${STAR}" fill="${fill}" opacity="${op}"/>`).join('');

function pole(x,y,h){
  let s='';
  for(let yy=-2;yy<h+4;yy+=7){
    const col=((yy/7)|0)%2?C.g2:C.red;
    s+=`<path d="M-4 ${yy} L4 ${yy-4.6} L4 ${yy-1.6} L-4 ${yy+3}Z" fill="${col}"/>`;
  }
  const cp=id('pole');
  return `<g transform="translate(${x} ${y})">
    <defs><clipPath id="${cp}"><rect x="-4" y="0" width="8" height="${h}" rx="4"/></clipPath></defs>
    <rect x="-4" y="0" width="8" height="${h}" rx="4" fill="#fff"/>
    <g clip-path="url(#${cp})">${s}</g>
    <rect x="-5.5" y="-3.5" width="11" height="4" rx="1.5" fill="${C.gold}"/>
    <rect x="-5.5" y="${h-.5}" width="11" height="4" rx="1.5" fill="${C.gold}"/>
    <rect x="-1.5" y="${h+3}" width="3" height="6" fill="${C.gold}"/>
  </g>`;
}
function awning(x,y,w,h,n){
  const sw=w/n; let s='';
  for(let i=0;i<n;i++){
    const col=i%2?'#fff':C.g2;

/* ---------- pseudo QR code ---------- */
function qr(seed,attrs=''){
  let h=2166136261; for(const ch of String(seed)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
  let s=h||1; const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return (s>>>0)/4294967296;};
  const n=25, m=Array.from({length:n},()=>Array(n).fill(0));
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)m[y][x]=rnd()<.47?1:0;
  const finder=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;
    const ring=(x===0||x===6||y===0||y===6),core=(x>=2&&x<=4&&y>=2&&y<=4);m[Y][X]=(x<0||y<0||x>6||y>6)?0:(ring||core)?1:0;}};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  for(let i=8;i<n-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0;}
  const ax=n-9,ay=n-9;for(let y=0;y<5;y++)for(let x=0;x<5;x++){const ring=(x===0||x===4||y===0||y===4);m[ay+y][ax+x]=(ring||(x===2&&y===2))?1:0;}
  let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return svg(`-1 -1 ${n+2} ${n+2}`,`<rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><g fill="${C.ink}" shape-rendering="crispEdges">${r}</g>`,attrs);
}

/* ---- shop clock, per-chair queue and customer notifications ---- */
let CLOCK=11*60+16;
const fmtT=m=>{let h=Math.floor(m/60),mm=m%60;const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(mm).padStart(2,"0")+" "+ap};
const tmin=t=>{const[hm,ap]=t.split(" ");let[h,m]=hm.split(":").map(Number);if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;return h*60+m};
const tick=(n=1)=>{CLOCK+=n;return fmtT(CLOCK)};
const byTime=(a,b)=>tmin(a.t)-tmin(b.t);
const durOf=n=>parseInt((SERVICES.find(s=>s.n===n)||{d:"30"}).d,10);
const chairOf=short=>{const b=BARBERS.find(x=>x.name.split(" ")[0]===short);return b?b.id:1};
const curFor=short=>BOOKINGS.find(x=>x.b===short&&x.s==="in-progress");
const waitingFor=short=>BOOKINGS.filter(x=>x.b===short&&["queued","pending"].includes(x.s)).sort(byTime);
const NOTIFS=[{t:"10:41 AM",c:"James Robles",msg:"Your chair is ready. Go to Jay's chair 1."},{t:"10:32 AM",c:"Andrei Lim",msg:"Your chair is ready. Go to Ken's chair 3."},{t:"10:26 AM",c:"Andrei Lim",msg:"You're up next. Check in at the front desk first, then go to Ken's chair 3."}];
const canNotify=x=>x.ph&&x.ph!=="No contact";
function notifyBooking(x,kind){
  const chair=`${x.b}'s chair ${chairOf(x.b)}`;
  const msg=kind==="chair"?`Your chair is ready. Go to ${chair}.`:kind==="checkin"?`You're up next. Check in at the front desk first, then go to ${chair}.`:kind;
  x.notified=tick();if(canNotify(x))NOTIFS.unshift({t:x.notified,c:x.c,msg});return msg;
}
function autoNext(short){const nxt=waitingFor(short)[0];if(!nxt)return null;notifyBooking(nxt,nxt.s==="queued"?"chair":"checkin");return nxt}
function qCall(id){const x=BOOKINGS.find(b=>b.id===id);const msg=notifyBooking(x,x.s==="queued"?"chair":"checkin");toast(canNotify(x)?`Sent to ${x.c}: "${msg}"`:`Front desk call: ${x.c} is ready for ${x.b}.`);render()}
function qCheckIn(id){const x=BOOKINGS.find(b=>b.id===id);if(x.s!=="pending")return;x.s="queued";x.arrivedAt=tick();
  if(!curFor(x.b)&&waitingFor(x.b)[0]===x){notifyBooking(x,"chair");toast(`${x.c} checked in. ${x.b}'s chair is open, so they were sent straight to it.`)}
  else toast(`${x.c} checked in. Position ${waitingFor(x.b).indexOf(x)+1} for ${x.b}.`);render()}
function qStartFor(id){const x=BOOKINGS.find(b=>b.id===id);const cur=curFor(x.b);if(cur){toast(`${x.b} is still cutting ${cur.c}. Mark that one done first.`);return}
  x.s="in-progress";x.startedAt=tick();toast(`${x.c} is in ${x.b}'s chair.`);render()}
function qDoneFor(id){const x=BOOKINGS.find(b=>b.id===id);if(x.s!=="in-progress")return;x.s="done";x.doneAt=tick();const nxt=autoNext(x.b);
  toast(nxt?`${x.c} done. ${nxt.c} is next for ${x.b}.`:`${x.c} done. Nobody else is waiting for ${x.b}.`);render()}
function qCompleteFor(id){const x=BOOKINGS.find(b=>b.id===id);if(x.s!=="done")return;x.s="complete";x.completedAt=tick();
  if(canNotify(x)){NOTIFS.unshift({t:x.completedAt,c:x.c,msg:`Thanks for visiting. Rate your cut with ${x.b}?`});toast(`${x.c} completed. ₱${x.total-x.p} collected, rating prompt sent.`)}
  else toast(`${x.c} completed. ₱${x.total-x.p} collected.`);render()}
function qNoShow(id){const x=BOOKINGS.find(b=>b.id===id);x.s="noshow";toast(x.source==="walk-in"?`${x.c} removed from the walk-in queue.`:`${x.c} flagged as no-show. The ₱${x.p} downpayment stays with the shop.`);render()}

            <div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:2px">
              <span>${s.n}</span><span class="dm">${s.bk} · ₱${(s.bk*s.p).toLocaleString()}</span></div>
              <div class="bar"><i style="width:${s.bk/52*100}%"></i></div></div>`).join("")}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card cardpad">
          <div class="cardhead"><h3>No-show rate</h3></div>
          <div style="text-align:center;padding:10px 0 4px">
            <div style="font-size:38px;font-weight:700;color:var(--acc)">4%</div>
            <div class="dm" style="font-size:12.5px;margin-top:4px">down from 23% before downpayments</div>
          </div>
          <div style="margin-top:14px;font-size:12.5px;color:var(--textMd);line-height:1.6">
            Requiring 50% upfront is what moved this number. Each recovered slot is roughly ₱195 in revenue.
          </div>
        </div>
        <div class="card cardpad">
          <div class="cardhead"><h3>Busiest days</h3></div>
          ${WEEK.slice().sort((a,b)=>b[1]-a[1]).map(([d,v])=>`
            <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:2px">
              <span>${d}</span><span class="dm">₱${v.toLocaleString()}</span></div>
              <div class="bar"><i style="width:${v/4260*100}%"></i></div></div>`).join("")}
        </div>
      </div>
    </div>`;
  }

  else if(page==="users"){
    const list=ufilter==="All"?USERS:USERS.filter(u=>u.role===ufilter);
    const nB=USERS.filter(u=>u.role==="barber").length, nI=USERS.filter(u=>u.st==="invited").length, other=PERSONAS.find(p=>p!==ME);
    const stats=[["Staff accounts",String(USERS.length),"across 3 branches","🔐"],["Barbers",String(nB),"barber app access","✂"],
      ["Awaiting first sign-in",String(nI),"role is applied when they sign in","✉"],["Customers","284","sign up on their own · not managed here","👥"]];
    h=`<div class="statgrid">${stats.map(([l,v,d,i])=>`<div class="stat"><span class="ic">${i}</span><div class="lbl">${l}</div><div class="val">${v}</div><div class="dlt">${d}</div></div>`).join("")}</div>
    <div class="cols" style="grid-template-columns:1fr 290px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card cardpad">
          <div class="cardhead"><div><h3>Staff accounts</h3><div class="sub">Only accounts added here get a staff role. Anyone else who signs in becomes a customer.</div></div>
            <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center">
              ${[["All","All"],["owner","Owner"],["manager","Manager"],["frontdesk","Front desk"],["barber","Barber"]].map(([k,l])=>`<button class="pill ${ufilter===k?"on":""}" onclick="setUfilter('${k}')">${l}</button>`).join("")}
              <button class="btn" onclick="openUser()">+ Add staff</button></div></div>
          <table><thead><tr><th>User</th><th>Signs in with</th><th>Role</th><th>Branch</th><th>Status</th><th>Last active</th><th style="text-align:right"></th></tr></thead>
          <tbody>${list.map(u=>`<tr onclick="openUser('${u.id}')">
            <td><div style="display:flex;align-items:center;gap:10px">${uav(u)}<div><div style="font-weight:600;white-space:nowrap">${u.n}</div><div class="dm" style="font-size:11.5px;white-space:nowrap">${u.title}</div></div></div></td>
            <td><div class="md">${u.method}</div><div class="dm" style="font-size:11.5px">${u.c}</div></td>
            <td>${rpill(u.role)}</td><td class="md">${u.br}</td><td>${upill(u.st)}</td><td class="dm">${u.last}</td>
            <td style="text-align:right;white-space:nowrap">${u.st==="invited"?`<button class="btn ghost sm" onclick="event.stopPropagation();toast('Invite sent again to ${u.c}')">Resend invite</button>`
              :u.role==="owner"?"":`<button class="btn ghost sm" onclick="event.stopPropagation();toggleUser('${u.id}')">${u.st==="disabled"?"Enable":"Disable"}</button>`}</td>
          </tr>`).join("")}</tbody></table>
          ${list.length===0?`<div style="text-align:center;padding:30px;color:var(--textDm);font-size:13px">No accounts with this role yet.</div>`:""}
        </div>
        <div class="card cardpad">
          <div class="cardhead"><div><h3>Roles and permissions</h3><div class="sub">Tap a box to change what a role can open. Owner is locked, and the two app roles are fixed.</div></div></div>
          <div style="overflow-x:auto"><table class="matrix"><thead><tr><th>Permission</th>${Object.keys(ROLES).map(r=>`<th style="text-align:center;color:${ROLES[r].c}">${ROLES[r].l}</th>`).join("")}</tr></thead>
          <tbody>${PERMS.map(([k,l])=>`<tr><td>${l}</td>${Object.keys(ROLES).map(r=>{const on=GRANTS[r].has(k),lock=["owner","barber","customer"].includes(r);
            return `<td class="c"><span class="tick ${on?"on":""} ${lock?"lock":""}" ${lock?"":`onclick="togglePerm('${r}','${k}')"`}>✓</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card cardpad">
          <div class="cardhead"><h3>How staff sign-in works</h3></div>
          ${[["1","The owner adds the account here","Name, the email or number they sign in with, role and branch."],["2","Staff sign in like everyone else","Google, Facebook or a phone code, on their own phone. Nothing extra to install."],["3","The app matches and applies the role","A matching account opens the barber app or this dashboard. Any other sign-in becomes a customer."]].map(([n,t,d])=>`
            <div style="display:flex;gap:11px;margin-bottom:13px"><div class="qnum" style="background:var(--acc)">${n}</div><div><div style="font-size:13px;font-weight:600">${t}</div><div style="font-size:12px;color:var(--textDm);line-height:1.5;margin-top:2px">${d}</div></div></div>`).join("")}
        </div>
        <div class="card cardpad" style="border-color:var(--borderHi)">
          <div class="cardhead"><h3>See it from another seat</h3></div>
          <div style="font-size:12.5px;color:var(--textMd);line-height:1.6">You're signed in as <b style="color:var(--text)">${ME.n}</b>, ${ROLES[ME.role].l}. Switch to ${other.n}, ${ROLES[other.role].l}, and the menu shrinks to what that role is allowed to open.</div>
          <button class="btn ghost" style="width:100%;margin-top:12px" onclick="switchMe()">View as ${other.n.split(" ")[0]}</button>
        </div>
      </div>
    </div>`;
  }

  if(WM.open){
    h+=`<div class="modal-bg" onclick="closeWalkIn()"><div class="modal" onclick="event.stopPropagation()">
      <div class="cardhead"><div><h3>Add walk-in</h3><div class="sub">Create a visit and place it directly in the selected barber's queue.</div></div><button class="tbtn" onclick="closeWalkIn()">✕</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Customer name <span class="dm">· optional</span></label><input id="wi-name" placeholder="Walk-in guest"></div>
        <div class="field"><label>Mobile number <span class="dm">· optional</span></label><input id="wi-contact" placeholder="For queue notifications"></div>
      </div>
      <div class="field"><label>Service</label><select id="wi-service">${SERVICES.map(s=>`<option value="${s.n}">${s.n} · ₱${s.p} · ${s.d}</option>`).join("")}</select></div>
      <div class="field"><label>Barber</label><select id="wi-barber">${BARBERS.map(b=>`<option value="${b.name.split(" ")[0]}">${b.name} · chair ${b.id} · ${b.busy?"busy":"available"}</option>`).join("")}</select></div>
      <div style="padding:11px 13px;border-radius:11px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.22);font-size:12px;color:var(--textMd);line-height:1.5;margin-bottom:16px">The visit is marked <b style="color:#60A5FA">Walk-in</b>, added as <b>In queue</b>, and starts with ₱0 paid.</div>
      <div style="display:flex;gap:9px;justify-content:flex-end"><button class="btn ghost" onclick="closeWalkIn()">Cancel</button><button class="btn" onclick="saveWalkIn()">Add to queue</button></div>
    </div></div>`;
  }

  if(UM.open){
    const d=UM.draft, isNew=!UM.id;
    h+=`<div class="modal-bg" onclick="closeUser()"><div class="modal" onclick="event.stopPropagation()">
      <div class="cardhead"><div><h3>${isNew?"Add staff account":"Edit "+d.n}</h3><div class="sub">${isNew?"They get this role the moment they sign in with the account below.":"Changes apply on their next sign-in."}</div></div><button class="tbtn" onclick="closeUser()">✕</button></div>
      <div class="field"><label>Full name</label><input id="um-n" value="${d.n}" placeholder="e.g. Jomar Tan"></div>
      <div class="field"><label>Signs in with (email or mobile number)</label><input id="um-c" value="${d.c}" placeholder="name@gmail.com or 0917 000 0000"></div>
      <div class="field"><label>Role</label><div class="rolecards">${["barber","frontdesk","manager","owner"].map(r=>`<div class="rolecard ${d.role===r?"on":""}" onclick="umRole('${r}')"><b style="color:${ROLES[r].c}">${ROLES[r].l}</b><span>${ROLES[r].d}</span></div>`).join("")}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Branch</label><select id="um-br">${["JP Laurel","Polomolok","Calumpang","All branches"].map(b=>`<option ${d.br===b?"selected":""}>${b}</option>`).join("")}</select></div>
        <div class="field"><label>${d.role==="barber"?"Title and chair":"Title"}</label><input id="um-t" value="${d.title||""}" placeholder="${d.role==="barber"?"e.g. Senior barber · chair 2":"e.g. Receptionist"}"></div>
      </div>
      <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:4px"><button class="btn ghost" onclick="closeUser()">Cancel</button><button class="btn" onclick="saveUser()">${isNew?"Send invite":"Save changes"}</button></div>
    </div></div>`;
  }

  document.getElementById("content").innerHTML=h;
  if(!UM.open&&!WM.open)document.getElementById("content").scrollTop=0;
}

render();
const bootEl=document.getElementById("boot");
setTimeout(()=>{bootEl.classList.add("out");setTimeout(()=>bootEl.remove(),600)},2100);
</script>
</body>
</html>
