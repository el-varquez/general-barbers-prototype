<!-- @dsCard group="Patterns" viewport="420x420" subtitle="The code the shop scans three times: reference, service, time, and what is paid so far" name="QR card" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:18px;background:var(--app-bg);display:flex;justify-content:center}
.card{background:var(--app-card);border:1px solid var(--app-border);border-radius:var(--r-lg);padding:18px;width:330px;text-align:center;color:var(--app-text)}
.qr{width:150px;height:150px;margin:0 auto 12px;border-radius:12px;background:#fff;padding:8px;box-sizing:border-box;position:relative}
.qr svg{width:100%;height:100%;display:block}
.qr b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.qr b .gb-logo{width:74%}
.ref{font-weight:700;font-size:17px;color:var(--a-400);letter-spacing:1px}
.meta{font-size:12.5px;color:var(--app-text-md);margin-top:5px;line-height:1.6}
.paid{margin-top:10px;padding:7px 14px;border-radius:10px;background:rgba(77,181,106,.09);display:inline-block;font-size:12px}
.paid b{color:var(--a-400)}.paid span{color:var(--app-text-dm);margin-left:8px}
</style></head><body>
<div class="card">
  <div class="qr" id="qr"></div>
  <div class="ref">GB-0048</div>
  <div class="meta">Skin fade with Jay Reyes<br>Sep 3, 2:00 PM · JP Laurel</div>
  <div class="paid"><b>Paid ₱100</b><span>Balance ₱100</span></div>
</div>
<script src="../components/gb-art.js"></script><script>document.getElementById('qr').innerHTML=GB_ART.qr('GB-0048')+'<b class="gb-logotile"><i class="gb-logo"></i></b>'</script>
</body></html>
